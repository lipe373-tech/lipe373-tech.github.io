<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Amanda Pinheiro · Financeiro</title>
<meta name="theme-color" content="#8A4B41">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AP Financeiro">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://amandapinheiro-6d032.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous"></script>
<style>
:root{
  --terra:#8A4B41;
  --terra-dark:#743D34;
  --terra-deep:#5F332B;
  --rose:#EDCFC6;
  --rose-soft:#F5E4DD;
  --cream:#FBF5F1;
  --bg:#F4E9E3;
  --ink:#3E2B26;
  --ink-soft:#7A5F58;
  --green:#6F8F6B;
  --green-bg:#E7EEE4;
  --red:#B04A38;
  --red-bg:#F6DDD6;
  --amber:#B98A3C;
  --amber-bg:#F3E8D3;
  --radius:16px;
  --shadow:0 4px 18px rgba(95,51,43,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px;color:var(--ink)}

/* ---------- LOGIN ---------- */
.loginwrap{position:fixed;inset:0;background:var(--terra);display:flex;align-items:center;justify-content:center;z-index:100}
.logincard{width:380px;max-width:92vw;text-align:center}
.logincard .monogram{font-family:'Playfair Display',Georgia,serif;font-size:110px;line-height:.9;color:var(--rose);letter-spacing:-20px;position:relative;display:inline-block}
.logincard .lname{font-size:12px;letter-spacing:6px;color:var(--rose);margin-top:4px}
.logincard .lsub{font-size:11px;letter-spacing:3.5px;color:rgba(237,207,198,.55);margin:10px 0 34px}
.logincard input{width:100%;padding:14px 18px;border:none;border-radius:12px;background:rgba(251,245,241,.96);margin-bottom:12px;outline:none;font-size:15px}
.logincard input:focus{box-shadow:0 0 0 2.5px var(--rose)}
.logincard .entrar{width:100%;padding:14px;border:none;border-radius:12px;background:var(--rose);color:var(--terra-deep);font-size:15.5px;font-weight:600;letter-spacing:1px;margin-top:6px;transition:.18s}
.logincard .entrar:hover{background:#fff}
.logincard .entrar:disabled{opacity:.6;cursor:wait}
.loginerr{background:rgba(0,0,0,.18);color:#FFD9CE;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px;display:none}
.loginerr.show{display:block}
.forgot{display:inline-block;margin-top:18px;color:rgba(237,207,198,.75);font-size:13px;background:none;border:none;text-decoration:underline}
.forgot:hover{color:var(--rose)}
.setupbox{background:rgba(251,245,241,.97);border-radius:16px;padding:26px 28px;text-align:left;color:var(--ink);font-size:14px;line-height:1.55}
.setupbox h2{font-family:'Playfair Display',serif;color:var(--terra-deep);font-size:20px;margin-bottom:10px}
.setupbox code{background:var(--rose-soft);padding:1px 6px;border-radius:6px;font-size:12.5px}

/* ---------- APP SHELL ---------- */
#appShell{display:none}
#appShell.on{display:flex}
.sidebar{width:250px;background:var(--terra);color:var(--rose);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10}
.logo{padding:38px 0 26px;text-align:center;position:relative}
.monogram{font-family:'Playfair Display',Georgia,serif;font-size:78px;line-height:.9;color:var(--rose);letter-spacing:-14px;position:relative;display:inline-block}
.monogram .p{margin-left:2px}
.logoname{position:absolute;left:0;right:0;top:88px;font-size:11px;letter-spacing:4.5px;font-weight:400;color:var(--rose);text-shadow:0 0 6px var(--terra),0 0 10px var(--terra)}
.logosub{margin-top:14px;font-size:11px;letter-spacing:3.5px;color:rgba(237,207,198,.6)}
.nav{flex:1;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border:none;background:transparent;color:rgba(237,207,198,.78);font-size:14.5px;letter-spacing:.6px;border-radius:10px;transition:.18s;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(237,207,198,.1);color:var(--rose)}
.nav button.active{background:var(--rose);color:var(--terra-dark);font-weight:500}
.nav .navbadge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.nav button.active .navbadge{background:var(--terra)}
.sidesearch{padding:0 12px 10px}
.sidesearch input{width:100%;padding:9px 12px;border:none;border-radius:10px;background:rgba(237,207,198,.14);color:var(--rose);font-size:13px;outline:none}
.sidesearch input::placeholder{color:rgba(237,207,198,.55)}
.sidesearch input:focus{background:rgba(237,207,198,.22)}
.sidefoot{padding:14px 18px 18px;font-size:11px;letter-spacing:1px;color:rgba(237,207,198,.45);text-align:center}
.sidefoot .sync{display:block;margin-bottom:8px;font-size:11px;letter-spacing:.5px;min-height:14px}
.sidefoot .sync.ok{color:rgba(237,207,198,.7)}
.sidefoot .sync.err{color:#FFB4A0}
.sairbtn{background:none;border:1px solid rgba(237,207,198,.35);color:rgba(237,207,198,.75);border-radius:99px;padding:5px 16px;font-size:12px;letter-spacing:1px;margin-bottom:10px}
.sairbtn:hover{border-color:var(--rose);color:var(--rose)}

/* ---------- MAIN ---------- */
.main{margin-left:250px;flex:1;padding:34px 42px;max-width:1250px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.topbar h1{font-family:'Playfair Display',serif;font-weight:500;font-size:30px;color:var(--terra-deep)}
.topbar .sub{font-size:14px;color:var(--ink-soft);margin-top:3px}
.btn{border:none;border-radius:99px;padding:11px 22px;font-size:14.5px;letter-spacing:.4px;transition:.18s}
.btn-primary{background:var(--terra);color:var(--rose)}
.btn-primary:hover{background:var(--terra-dark)}
.btn-ghost{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.btn-ghost:hover{background:var(--rose-soft)}
.btn-sm{padding:6px 14px;font-size:13px}

/* ---------- CARDS ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.card{background:var(--cream);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.card .lbl{font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.card .val{font-family:'Playfair Display',serif;font-size:27px;font-weight:500;color:var(--terra-deep)}
.card .val.pos{color:var(--green)}
.card .val.neg{color:var(--red)}
.card .note{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.card .note b{color:var(--red)}

.panelrow{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:24px}
.panel{background:var(--cream);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.panel h3{font-family:'Playfair Display',serif;font-weight:500;font-size:18px;color:var(--terra-deep);margin-bottom:16px}
.chartbox{position:relative;height:260px}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--rose)}
td{padding:12px;font-size:14.5px;border-bottom:1px solid var(--rose-soft)}
tr:hover td{background:rgba(237,207,198,.18)}
td.money{font-weight:500;white-space:nowrap}
td .desc-sub{font-size:12px;color:var(--ink-soft)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12.5px;font-weight:500}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.pill.bad{background:var(--red-bg);color:var(--red)}
.rowbtn{border:none;background:transparent;color:var(--ink-soft);font-size:15px;padding:4px 7px;border-radius:7px}
.rowbtn:hover{background:var(--rose);color:var(--terra-dark)}
.empty{padding:40px;text-align:center;color:var(--ink-soft);font-size:15px}
.conf{width:24px;height:24px;border:1.8px solid #CFA79D;border-radius:7px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:transparent;padding:0;margin-right:10px;vertical-align:middle;transition:.15s;flex:none}
.conf svg{width:14px;height:14px}
.conf:hover{border-color:var(--terra)}
.conf.on{background:var(--green);border-color:var(--green);color:#fff}
.conf:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
td .datacell{display:inline-flex;align-items:center;white-space:nowrap}
tr.conferido td{color:var(--ink-soft)}
tr.conferido td.money{opacity:.65}
.confbar{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink-soft);width:100%}
.confbar .track{width:120px;height:6px;border-radius:99px;background:var(--rose-soft);overflow:hidden;flex:none}
.confbar .track i{display:block;height:100%;background:var(--green)}

/* ---------- FILTERS ---------- */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:9px 14px;border:1.5px solid var(--rose);border-radius:10px;background:var(--cream);outline:none}
.filters select:focus,.filters input:focus{border-color:var(--terra)}

/* ---------- LISTS ---------- */
.duelist{display:flex;flex-direction:column;gap:10px}
.dueitem{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg);border-radius:12px}
.dueitem .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dueitem .who{flex:1;min-width:0}
.dueitem .who .n{font-size:14.5px;font-weight:500}
.dueitem .who .d{font-size:12px;color:var(--ink-soft)}
.dueitem .amt{font-weight:600;font-size:14.5px;color:var(--terra-deep);white-space:nowrap}

.ranklist .rk{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rose-soft)}
.ranklist .rk:last-child{border:none}
.ranklist .bar{height:7px;border-radius:99px;background:var(--terra);opacity:.85}
.ranklist .nm{width:130px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranklist .vl{margin-left:auto;font-size:13.5px;font-weight:500;color:var(--terra-deep);white-space:nowrap}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(62,43,38,.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--cream);border-radius:20px;padding:30px 32px;width:460px;max-width:92vw;max-height:90vh;overflow:auto}
.modal h2{font-family:'Playfair Display',serif;font-weight:500;font-size:22px;color:var(--terra-deep);margin-bottom:20px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 14px;border:1.5px solid var(--rose);border-radius:10px;background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--terra)}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modalbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--rose);border-radius:10px;background:#fff;outline:none;font-family:inherit;font-size:14.5px;min-height:70px;resize:vertical}
.field textarea:focus{border-color:var(--terra)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px dashed var(--terra);background:transparent;color:var(--terra);border-radius:99px;padding:5px 12px;font-size:12.5px}
.chip:hover{background:var(--rose-soft)}
.chipchk{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rose);border-radius:99px;padding:5px 12px;font-size:12.5px;background:#fff;cursor:pointer;color:var(--ink)}
.chipchk input{width:auto!important;accent-color:var(--terra);margin:0}
.field label.chipchk{display:inline-flex;text-transform:none;letter-spacing:0;font-size:12.5px;margin:0;color:var(--ink)}
.chipchk:has(input:checked){background:var(--rose-soft);border-color:var(--terra);color:var(--terra-dark)}
.prop-item{display:flex;gap:7px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.prop-item input,.prop-item select{padding:9px 10px;border:1.5px solid var(--rose);border-radius:9px;background:#fff;outline:none;font-size:13.5px}
.prop-item input:focus,.prop-item select:focus{border-color:var(--terra)}
.prop-item .pi-nome{flex:1;min-width:130px}
.prop-item .pi-valor{width:95px}
.prop-item .pi-tipo{width:95px}
.prop-item .pi-x{border:none;background:transparent;color:var(--red);font-size:16px;padding:4px 6px;border-radius:7px}
.prop-item .pi-x:hover{background:var(--red-bg)}
.prop-item .pi-det{width:100%;padding:9px 11px;border:1.5px solid var(--rose);border-radius:9px;font-family:inherit;font-size:12.5px;resize:vertical;background:#fff;outline:none;min-height:100px;line-height:1.5}
.prop-item .pi-det:focus{border-color:var(--terra)}
.as-wrap{width:100%;background:var(--rose-soft);border-radius:9px;padding:9px 12px;font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--terra-dark)}
.as-wrap label{display:flex;align-items:center;gap:5px}
.as-wrap input[type=number]{width:52px;padding:4px 6px;border:1.5px solid var(--rose);border-radius:7px;background:#fff;outline:none;font-size:12.5px}
.as-wrap .as-chk input{width:auto;accent-color:var(--terra)}
.as-wrap .as-sep{font-weight:500}

/* ---------- REPORT ---------- */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.repline{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--rose-soft);font-size:15px}
.repline:last-child{border:none}
.repline .v{font-weight:600}
.repline.total{font-size:17px}
.repline.total .v{font-family:'Playfair Display',serif;font-size:20px}
.taxbox{background:var(--rose-soft);border-radius:12px;padding:16px 18px;margin-top:14px}
.taxbox .t{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--terra-dark);margin-bottom:4px}
.taxbox .v{font-family:'Playfair Display',serif;font-size:24px;color:var(--terra-deep)}
.taxbox .cfg{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.taxbox input{width:56px;padding:3px 8px;border:1.5px solid var(--rose);border-radius:8px;background:#fff;outline:none}

.samplebar{background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:10px 18px;font-size:13.5px;display:flex;align-items:center;gap:14px;margin-bottom:20px}
.samplebar button{border:none;background:var(--amber);color:#fff;border-radius:99px;padding:5px 14px;font-size:12.5px}

/* ---------- CARTÕES DE CLIENTE ---------- */
.clientgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.clientcard{background:var(--cream);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.clientcard .cc-top{display:flex;align-items:flex-start;gap:8px}
.clientcard .cc-nome{font-family:'Playfair Display',serif;font-size:19px;color:var(--terra-deep);flex:1;line-height:1.25}
.clientcard .cc-acoes{display:flex;gap:2px;flex:none}
.clientcard .cc-serv{font-size:13.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.clientcard .cc-valor{font-family:'Playfair Display',serif;font-size:26px;color:var(--terra);margin-top:14px}
.clientcard .cc-valor span{font-family:'Jost';font-size:13px;color:var(--ink-soft);margin-left:2px}
.clientcard .cc-status{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.clientcard .cc-dia{font-size:12.5px;color:var(--ink-soft)}
.clientcard .cc-rel{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.clientcard .rel-chip{flex:1;min-width:130px;border:1.5px solid var(--rose);background:transparent;color:var(--ink-soft);border-radius:9px;padding:8px 10px;font-size:12.5px;transition:.15s}
.clientcard .rel-chip:hover{border-color:var(--terra)}
.clientcard .rel-chip.on{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600}
.clientcard .cc-foot{display:flex;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rose-soft)}
.clientcard .cc-foot div{flex:1}
.clientcard .cc-foot span{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft)}
.clientcard .cc-foot b{font-size:15px;color:var(--terra-deep);font-weight:600}
.clientcard.inativo{opacity:.72;background:var(--bg)}
.clientcard.inativo .cc-valor{color:var(--ink-soft)}

.nav .mobileonly{display:none!important}
.nav .sh{display:none}
.mtopbar{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.panelrow,.report-grid{grid-template-columns:1fr}}
@media(max-width:800px){
  /* ---------- BARRA SUPERIOR (app bar) ---------- */
  .mtopbar{display:flex;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;background:var(--terra);color:var(--rose);z-index:45;box-shadow:0 2px 12px rgba(95,51,43,.22)}
  .mtopbar .mono{font-family:'Playfair Display',serif;font-size:30px;letter-spacing:-6px;line-height:1;flex:none}
  .mtopbar .mono .p{margin-left:1px}
  .mtopbar .mt-title{flex:1;font-size:16px;letter-spacing:.4px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mtopbar .mt-sync{font-size:13px;opacity:.8;flex:none}
  .mtopbar .mt-sync.err{color:#FFB4A0;opacity:1}
  .mtopbar .mt-searchbtn{flex:none;background:none;border:none;color:var(--rose);font-size:17px;padding:2px 4px}
  .mtopbar .mt-search{display:none;flex:1;border:none;border-radius:9px;padding:8px 12px;background:rgba(255,255,255,.92);color:var(--ink);font-size:15px;outline:none}
  .mtopbar.searching .mt-title{display:none}
  .mtopbar.searching .mt-search{display:block}
  .mtopbar.searching .mono{display:none}

  /* ---------- MENU INFERIOR ---------- */
  .sidebar{top:auto;bottom:0;width:100%;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex-direction:row;align-items:stretch;background:var(--terra);box-shadow:0 -3px 16px rgba(95,51,43,.28);z-index:40}
  .logo,.sidefoot,.sidesearch{display:none}
  .nav{flex-direction:row;padding:6px 6px;gap:2px;overflow-x:auto;align-items:center;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity}
  .nav::-webkit-scrollbar{display:none}
  .nav button{position:relative;flex:none;width:64px;flex-direction:column;gap:3px;padding:6px 4px;font-size:11px;letter-spacing:0;border-radius:12px;justify-content:center;align-items:center;text-align:center;color:rgba(237,207,198,.7);scroll-snap-align:center}
  .nav button span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
  .nav .lg{display:none}
  .nav .sh{display:inline}
  .nav button svg{width:21px;height:21px}
  .nav button.active{background:var(--rose);color:var(--terra-dark);font-weight:600}
  .nav .navbadge{position:absolute;top:2px;right:8px;margin:0;font-size:9px;padding:0 5px;line-height:15px;min-width:15px}
  .nav .mobileonly{display:flex!important}

  const c=d.config&&typeof d.config==='object'?d.config:{};
  out.config={taxPct:S.optNum(c.taxPct)??6,simTax:S.optNum(c.simTax),metaAno:S.optNum(c.metaAno),sample:S.bool(c.sample),
    lastGen:S.re(c.lastGen,/^\d{4}-\d{2}$/),ultimaCopia:S.date(c.ultimaCopia),servicos:S.lista(c.servicos),servModelos:S.modelos(c.servModelos),catIn:S.lista(c.catIn),catOut:S.lista(c.catOut)};
  out._rev=S.int(d._rev,0,1e9,0);
  return out;
}

/* ================= NUVEM (Firestore) =================
   Cada gravação leva um contador de versão (_rev). Se outro aparelho/aba gravou
   depois que estes dados foram carregados, a gravação é recusada em vez de
   apagar o que foi feito lá (as regras do Firestore conferem o mesmo). */
function setSync(txt,cls){const el=document.getElementById('syncStatus');if(el){el.textContent=txt;el.className='sync '+(cls||'');}
  const m=document.getElementById('mSync');if(m){m.textContent=cls==='err'?'⚠':(/salvo/.test(txt)?'✓':'⋯');m.className='mt-sync'+(cls==='err'?' err':'');}}
const docRef=()=>doc(db,'financeiro',currentUser.uid);
const copiaRef=dia=>doc(db,'financeiro',currentUser.uid,'copias',dia);
let saving=false,dirty=false,conflito=false;
async function loadData(){
  const snap=await getDoc(docRef());
  if(snap.exists()){state=sanitizeState(snap.data());}
  else{state=sanitizeState(seed());await persist();}
  carregarListas();
  if(gerarRecorrentes())await persist();
}

/* ---------- RECORRENTES: gera mensalidades e contas fixas na virada do mês ---------- */
function gerarRecorrentes(){
  const y=thisYM();
  if(state.config.lastGen===y)return false;
  let n=0;
  // mensalidades dos clientes com valor mensal
  state.clientes.filter(c=>c.valorMensal>0&&c.status!=='inativo').forEach(c=>{
    const ja=state.entradas.some(e=>e.clienteId===c.id&&ym(e.data)===y&&e.descricao==='Mensalidade');
    if(!ja){
      const dia=Math.min(c.diaCobranca||5,28);
      const dataE=y+'-'+String(dia).padStart(2,'0');
      state.entradas.push({id:uid(),data:dataE,descricao:'Mensalidade',clienteId:c.id,categoria:c.categoria||'Gestão de redes',valor:c.valorMensal,status:'a_receber',semNota:!!c.semNota,prevista:dataE,formaPgto:'Pix'});
      n++;
    }
  });
  // contas marcadas como "repetir todo mês": clona a mais recente de cada
  const grupos={};
  state.contas.filter(c=>c.recorrente).forEach(c=>{
    const k=(c.fornecedorId||'')+'|'+c.descricao;
    if(!grupos[k]||c.vencimento>grupos[k].vencimento)grupos[k]=c;
  });
  Object.values(grupos).forEach(m=>{
    if(ym(m.vencimento)>=y)return;
    const dia=Math.min(parseInt(m.vencimento.slice(8,10),10)||10,28);
    state.contas.push({id:uid(),fornecedorId:m.fornecedorId,descricao:m.descricao,valor:m.valor,vencimento:y+'-'+String(dia).padStart(2,'0'),status:'pendente',recorrente:true});
    n++;
  });
  state.config.lastGen=y;
  return true;
}
async function persist(){
  if(!currentUser||!state||conflito)return;
  if(saving){dirty=true;return;} // já tem gravação em andamento: grava de novo ao terminar
  saving=true;
  setSync('salvando…','ok');
  try{
    do{
      dirty=false;
      const base=state._rev||0;
      // JSON round-trip remove valores undefined, que o Firestore rejeita
      const data=JSON.parse(JSON.stringify({...state,_rev:base+1}));
      let copiou=null;
      await runTransaction(db,async tx=>{
        const snap=await tx.get(docRef());
        const remoto=snap.exists()?(snap.data()._rev||0):0;
        if(remoto!==base)throw Object.assign(new Error('conflito de versão'),{code:'ap/conflito'});
        // cópia diária: no 1º salvamento do dia guarda os dados como estavam antes
        // (as regras só permitem criar cópias, nunca alterar ou apagar; pula se o
        // documento estiver perto do limite de 1 MB, para nunca travar o salvamento)
        const hoje=today();
        if(snap.exists()&&(snap.data().config||{}).ultimaCopia!==hoje&&JSON.stringify(snap.data()).length<900000){
          const c=await tx.get(copiaRef(hoje));
          if(!c.exists())tx.set(copiaRef(hoje),{feitaEm:new Date().toISOString(),rev:remoto,dados:snap.data()});
          data.config.ultimaCopia=hoje;copiou=hoje;
        }
        tx.set(docRef(),data);
      });
      state._rev=base+1;
      if(copiou)state.config.ultimaCopia=copiou;
    }while(dirty);
    setSync('✓ salvo na nuvem','ok');
  }catch(e){
    console.error(e);
    if(e.code==='ap/conflito'){conflito=true;mostrarConflito();}
    else setSync('⚠ erro ao salvar ('+(e.code||'verifique a internet')+')','err');
  }finally{
    saving=false;
  }
}
function save(){ // agrupa gravações rápidas em uma só
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{saveTimer=null;persist();},400);
}
async function flushSave(){ // grava o que estiver pendente antes de sair
  if(saveTimer){clearTimeout(saveTimer);saveTimer=null;await persist();}
  for(let i=0;saving&&i<100;i++)await new Promise(r=>setTimeout(r,100));
}
function mostrarConflito(){
  setSync('⚠ não salvo: recarregue a página','err');
  const md=document.getElementById('modal');
  md.innerHTML=`<h2>⚠ Dados alterados em outro aparelho</h2>
    <p style="font-size:14px;line-height:1.6;color:var(--ink-soft)">O sistema foi usado em outro aparelho ou aba depois que esta tela foi aberta.
    Para não apagar o que foi feito lá, as últimas alterações feitas <b>aqui</b> não foram salvas.</p>
    <p style="font-size:14px;line-height:1.6;color:var(--ink-soft);margin-top:10px">Recarregue para ver os dados atualizados e refaça a alteração. Se quiser, baixe antes uma cópia do que está nesta tela.</p>
    <div class="modalbtns"><button class="btn btn-ghost" onclick="exportJSON()">⤓ Baixar cópia desta tela</button><button class="btn btn-primary" onclick="location.reload()">Recarregar</button></div>`;
  document.getElementById('overlay').classList.add('open');
}
/* Ao voltar para a aba/app, puxa a versão mais nova se outro aparelho gravou */
async function atualizarSeMudou(){
  if(!currentUser||!state||saving||saveTimer||conflito)return;
  if(document.getElementById('overlay').classList.contains('open'))return;
  try{
    const snap=await getDoc(docRef());
    if(snap.exists()&&(snap.data()._rev||0)>(state._rev||0)&&!saving&&!saveTimer){state=sanitizeState(snap.data());carregarListas();render();}
  }catch(e){console.error(e);}
}

/* ================= SESSÃO: encerra após inatividade ================= */
const IDLE_MS=30*60*1000;
const IDLE_KEY='ap_ultimaAtividade';
let ultimaAtiv=Date.now();
function lerAtiv(){try{return Number(localStorage.getItem(IDLE_KEY))||0;}catch(e){return 0;}}
function marcarAtiv(force){
  const t=Date.now();
  if(!force&&t-ultimaAtiv<10000)return;
  ultimaAtiv=t;
  try{localStorage.setItem(IDLE_KEY,String(t));}catch(e){}
}
['pointerdown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,()=>marcarAtiv(),{passive:true,capture:true}));
function ociosoDemais(){return Date.now()-Math.max(ultimaAtiv,lerAtiv())>IDLE_MS;}
async function checkIdle(){
  if(currentUser&&ociosoDemais()){await encerrarSessao('Sessão encerrada após 30 minutos sem uso. Entre novamente.');return true;}
  return false;
}
setInterval(checkIdle,60000);
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible')return;
  if(await checkIdle())return;
  atualizarSeMudou();
});

const fmt=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fdate=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;};
const today=()=>new Date().toISOString().slice(0,10);
const ym=s=>s.slice(0,7);
const thisYM=()=>today().slice(0,7);
function semKey(dt=new Date()){const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));const wk=Math.ceil((((d-ys)/86400000)+1)/7);return d.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');}
const monthName=y=>{const[a,b]=y.split('-');return new Date(a,b-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});};
const cliName=id=>{const c=state.clientes.find(x=>x.id===id);return c?c.nome:'—';};
const fornName=id=>{const f=state.fornecedores.find(x=>x.id===id);return f?f.nome:'—';};
const contaStatus=c=>c.status==='pago'?'pago':(c.vencimento<today()?'atrasado':'pendente');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function sumMonth(list,y){return list.filter(x=>ym(x.data)===y).reduce((a,b)=>a+b.valor,0);}
function lastMonths(n){
  const out=[];const t=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);out.push(d.toISOString().slice(0,7));}
  return out;
}

/* No celular as tabelas viram cartões: copia o cabeçalho para cada célula */
function rotularCelulas(){
  document.querySelectorAll('#main table').forEach(t=>{
    const heads=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{
        if(heads[i])td.setAttribute('data-label',heads[i]);
        else td.removeAttribute('data-label');
      });
    });
  });
}

function salvarServ(i){
  const nome=document.getElementById('se_nome').value.trim().slice(0,120);
  const det=document.getElementById('se_det').value.replace(/\s+$/,'').slice(0,4000);
  if(!nome){alert('Dê um nome ao serviço.');return;}
  const arr=SERVICOS_SUGERIDOS.slice();const antigo=i>=0?arr[i]:null;
  if(arr.some((x,j)=>j!==i&&x.toLowerCase()===nome.toLowerCase())){alert('"'+nome+'" já está na lista.');return;}
  if(i>=0)arr[i]=nome;else arr.push(nome);
  const lc=x=>x.toLowerCase();
  const modelos=(state.config.servModelos||[]).filter(m=>lc(m.nome)!==lc(nome)&&(!antigo||lc(m.nome)!==lc(antigo)));
  // serviço com texto automático salvo sem alteração: continua automático
  if(!(ASSISTENTES[nome]&&det===textoPadraoServ(nome)))modelos.push({nome,detalhes:det});
  state.config.servModelos=modelos;state.config.servicos=arr;
  // renomeou: clientes que tinham o serviço marcado continuam com ele
  if(antigo&&antigo!==nome)state.clientes.forEach(c=>{if(Array.isArray(c.servicos))c.servicos=c.servicos.map(x=>x===antigo?nome:x);});
  carregarListas();save();servEdit=null;rerenderListas();
}

}

function baixarCopia(id){

function restaurarCopia(id){
  const c=copiasCache[id];if(!c)return;
  if(!confirm('Restaurar a cópia de '+fdate(id)+' vai SUBSTITUIR os dados atuais. Antes, uma cópia dos dados atuais será baixada no seu aparelho. Continuar?'))return;

  const rev=state._rev||0,uc=state.config.ultimaCopia;

  alert('Cópia de '+fdate(id)+' restaurada.');
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
function exportJSON(){
  download('backup-financeiro-'+today()+'.json',new Blob([JSON.stringify({app:'ap-financeiro',versao:1,geradoEm:new Date().toISOString(),dados:state},null,2)],{type:'application/json'}));
}
async function loadXLSX(){
  if(window.XLSX)return;
  await new Promise((ok,err)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.integrity='sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==';s.crossOrigin='anonymous';s.onload=ok;s.onerror=()=>err(new Error('Não foi possível baixar o gerador de Excel. Verifique a internet.'));document.head.appendChild(s);});
}
async function exportExcel(){
  try{await loadXLSX();}catch(e){alert(e.message);return;}
  const wb=XLSX.utils.book_new();
  const add=(nome,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{Aviso:'Sem registros'}]),nome);
  add('Entradas',state.entradas.map(e=>({Data:fdate(e.data),'Descrição':e.descricao,Cliente:cliName(e.clienteId),Categoria:e.categoria,'Valor (R$)':e.valor,Status:e.status==='recebido'?'Recebido':'A receber','Forma':e.formaPgto||'','Prevista para':e.prevista?fdate(e.prevista):'','Nota fiscal':e.semNota?'Não':'Sim','Conferido no extrato':e.conferido?'Sim':'Não'})));
  add('Saídas',state.saidas.map(s=>({Data:fdate(s.data),'Descrição':s.descricao,Fornecedor:fornName(s.fornecedorId),Categoria:s.categoria,'Valor (R$)':s.valor,'Contabilidade':s.semContab?'Não':'Sim','Conferido no extrato':s.conferido?'Sim':'Não'})));
  add('Contas a pagar',state.contas.map(c=>({Vencimento:fdate(c.vencimento),Fornecedor:fornName(c.fornecedorId),'Descrição':c.descricao,'Valor (R$)':c.valor,Status:contaStatus(c)==='pago'?'Paga':contaStatus(c)==='atrasado'?'Atrasada':'Pendente','Paga em':c.pagoEm?fdate(c.pagoEm):''})));
  add('Fornecedores',state.fornecedores.map(f=>({Nome:f.nome,'Serviço':f.servico,Contato:f.contato})));
  add('Clientes',state.clientes.map(c=>({Nome:c.nome,'Serviços':c.servico,'Valor mensal (R$)':c.valorMensal||'','Dia de cobrança':c.valorMensal?(c.diaCobranca||5):'','Situação':c.status==='inativo'?'Inativo':'Ativo','Cliente desde':c.desde?fdate(c.desde):'','Saiu em':c.saidaEm?fdate(c.saidaEm):'','Nota fiscal':c.semNota?'Não':'Sim'})));
  add('Contratos',state.contratos.map(c=>({Cliente:cliName(c.clienteId),'Contrato':c.titulo,'Valor (R$)':c.valor,Tipo:c.periodicidade==='projeto'?'Projeto único':'Mensal','Início':fdate(c.inicio),'Término':c.fim?fdate(c.fim):'','Status':c.status,'Obs':c.obs||''})));
  add('Propostas',state.propostas.map(p=>{const t=propTotais(p);return {Data:fdate(p.data),Cliente:p.nome,'Serviços':p.itens.map(i=>i.nome).join(', '),'Mensal (R$)':t.mensal||'','Único (R$)':t.unico||'','Desconto (R$)':p.desconto||'','Válida até':p.validade?fdate(p.validade):'',Status:p.status};}));
  XLSX.writeFile(wb,'backup-financeiro-'+today()+'.xlsx');
}
function restoreBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      const d=j.dados||j;
      if(!Array.isArray(d.entradas)||!Array.isArray(d.saidas))throw new Error('estrutura inválida');
      if(!confirm('Restaurar este backup vai SUBSTITUIR todos os dados atuais pelos do arquivo'+(j.geradoEm?' (gerado em '+fdate(j.geradoEm.slice(0,10))+')':'')+'. Continuar?'))return;
      const rev=state._rev||0,uc=state.config.ultimaCopia;
      state=sanitizeState(d);
      state._rev=rev; // a versão é a da nuvem, não a do arquivo
      state.config.ultimaCopia=uc;
      carregarListas();save();closeModal();render();
      alert('Backup restaurado com sucesso!');
    }catch(e){alert('Arquivo de backup inválido: '+e.message);}
  };
  r.readAsText(file);
}

  const saldo=ent-sai;
  const pend=state.contas.filter(c=>c.status!=='pago');
  const pendTotal=pend.reduce((a,b)=>a+b.valor,0);
  const atras=pend.filter(c=>contaStatus(c)==='atrasado').length;
  const prox=pend.slice().sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).slice(0,5);

  const rec={};
  state.entradas.filter(e=>e.status==='recebido'&&e.clienteId).forEach(e=>{rec[e.clienteId]=(rec[e.clienteId]||0)+e.valor;});
  const top=Object.entries(rec).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max=top.length?top[0][1]:1;
  const atrasRec=state.entradas.filter(e=>e.status==='a_receber'&&e.prevista&&e.prevista<today()).sort((a,b)=>a.prevista.localeCompare(b.prevista)).slice(0,6);

  // comparativo com o mês anterior
  const ymAnt=(function(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})();
  const entAnt=state.entradas.filter(e=>ym(e.data)===ymAnt&&e.status==='recebido').reduce((a,b)=>a+b.valor,0);
  const varPct=entAnt>0?((ent-entAnt)/entAnt*100):null;
  const setaTxt=varPct==null?'':(varPct>=0?'▲ ':'▼ ')+Math.abs(varPct).toFixed(0)+'% vs '+monthName(ymAnt).split(' de ')[0];
  const setaCor=varPct==null?'var(--ink-soft)':varPct>=0?'var(--green)':'var(--red)';
  // ticket médio (clientes ativos com receita no mês)
  const clientesMes=new Set(state.entradas.filter(e=>ym(e.data)===y&&e.status==='recebido'&&e.clienteId).map(e=>e.clienteId));
  const ticket=clientesMes.size?ent/clientesMes.size:0;

  return `
  <div class="topbar"><div><h1>Olá, Amanda ✦</h1><div class="sub">Resumo de ${monthName(y)}</div></div>
    <button class="btn btn-primary" onclick="openForm('entrada')">+ Nova entrada</button></div>
  <div class="cards">
    <div class="card"><div class="lbl">Entradas do mês</div><div class="val pos">${fmt(ent)}</div><div class="note">${setaTxt?`<b style="color:${setaCor}">${setaTxt}</b>`:''}${aRec?`${setaTxt?' · ':''}+ ${fmt(aRec)} a receber`:''}${atrasRec.length?` · <b>${atrasRec.length} atrasado(s)</b>`:''}</div></div>
    <div class="card"><div class="lbl">Saídas do mês</div><div class="val neg">${fmt(sai)}</div></div>
    <div class="card"><div class="lbl">Saldo do mês</div><div class="val ${saldo>=0?'pos':'neg'}">${fmt(saldo)}</div></div>
    <div class="card"><div class="lbl">Ticket médio</div><div class="val" style="color:var(--terra)">${fmt(ticket)}</div><div class="note">${clientesMes.size} cliente(s) no mês</div></div>
  </div>
  <div class="cards" style="margin-bottom:24px">
    <div class="card"><div class="lbl">Contas a pagar</div><div class="val">${fmt(pendTotal)}</div><div class="note">${pend.length} conta(s)${atras?` · <b>${atras} atrasada(s)</b>`:''}</div></div>
    <div class="card"><div class="lbl">A receber (mês)</div><div class="val" style="color:var(--amber)">${fmt(aRec)}</div><div class="note">${atrasRec.length?`<b style="color:var(--red)">${atrasRec.length} atrasado(s)</b>`:'em dia'}</div></div>
    <div class="card"><div class="lbl">NF a emitir</div><div class="val" style="color:${state.entradas.filter(e=>!e.semNota&&e.nfEmitida===false).length?'var(--red)':'var(--terra)'}">${state.entradas.filter(e=>!e.semNota&&e.nfEmitida===false).length}</div><div class="note">${state.entradas.filter(e=>!e.semNota&&e.nfEmitida===false).length?'nota(s) pendente(s)':'tudo emitido ✓'}</div></div>
    <div class="card"><div class="lbl">Relatórios da semana</div><div class="val" style="color:${state.clientes.filter(c=>c.status!=='inativo'&&c.relSemanaEm!==semKey()).length?'var(--amber)':'var(--green)'}">${state.clientes.filter(c=>c.status!=='inativo'&&c.relSemanaEm===semKey()).length}/${state.clientes.filter(c=>c.status!=='inativo').length}</div><div class="note">${state.clientes.filter(c=>c.status!=='inativo'&&c.relSemanaEm!==semKey()).length} a enviar${state.clientes.filter(c=>c.status!=='inativo'&&c.relMesEm!==thisYM()).length?` · ${state.clientes.filter(c=>c.status!=='inativo'&&c.relMesEm!==thisYM()).length} mensal`:''}</div></div>
  </div>
  <div class="panelrow">
    <div class="panel"><h3>Fluxo de caixa — últimos 6 meses</h3><div class="chartbox"><canvas id="chFlux"></canvas></div></div>
    <div class="panel"><h3>Saídas por categoria (mês)</h3><div class="chartbox"><canvas id="chCat"></canvas></div></div>
  </div>
  <div class="panelrow">
    <div class="panel"><h3>Próximos vencimentos</h3>
      ${prox.length?`<div class="duelist">${prox.map(c=>{
        const st=contaStatus(c);
        return `<div class="dueitem"><span class="dot" style="background:${st==='atrasado'?'var(--red)':'var(--amber)'}"></span>
        <div class="who"><div class="n">${esc(c.fornecedorId?fornName(c.fornecedorId):c.descricao)}</div><div class="d">${esc(c.descricao)} · vence ${fdate(c.vencimento)}${st==='atrasado'?' · <b style="color:var(--red)">atrasada</b>':''}</div></div>
        <span class="amt">${fmt(c.valor)}</span>
        <button class="btn btn-ghost btn-sm" onclick="pagarConta('${c.id}')">Pagar</button></div>`;
      }).join('')}</div>`:`<div class="empty">Nenhuma conta pendente 🎉</div>`}
    </div>
    <div class="panel"><h3>Top clientes (receita total)</h3>
      ${top.length?`<div class="ranklist">${top.map(([id,v])=>
        `<div class="rk"><span class="nm">${esc(cliName(id))}</span><span class="bar" style="width:${Math.max(8,Math.round(v/max*120))}px"></span><span class="vl">${fmt(v)}</span></div>`
      ).join('')}</div>`:`<div class="empty">Cadastre entradas com clientes para ver o ranking</div>`}
    </div>
  </div>
  <div class="panelrow">
    <div class="panel"><h3>Recebimentos em atraso</h3>
      ${atrasRec.length?`<div class="duelist">${atrasRec.map(e=>`<div class="dueitem"><span class="dot" style="background:var(--red)"></span>
        <div class="who"><div class="n">${esc(e.clienteId?cliName(e.clienteId):e.descricao)}</div><div class="d">${esc(e.descricao)} · previsto para ${fdate(e.prevista)}</div></div>
        <span class="amt">${fmt(e.valor)}</span>
        <button class="btn btn-ghost btn-sm" onclick="receber('${e.id}')">Recebi ✓</button></div>`).join('')}</div>`:`<div class="empty">Nenhum recebimento em atraso 🎉</div>`}
    </div>
    <div class="panel"><h3>Formas de recebimento (mês)</h3><div class="chartbox" style="height:220px"><canvas id="chFormas"></canvas></div></div>
  </div>`;
}

function drawDashCharts(){
  const months=lastMonths(6);
  const labels=months.map(y=>{const[a,b]=y.split('-');return new Date(a,b-1,1).toLocaleDateString('pt-BR',{month:'short'});});
  const din=months.map(y=>state.entradas.filter(e=>ym(e.data)===y&&e.status==='recebido').reduce((a,b)=>a+b.valor,0));
  const dout=months.map(y=>sumMonth(state.saidas,y));
  Chart.defaults.font.family='Jost';Chart.defaults.color='#7A5F58';
  charts.flux=new Chart(document.getElementById('chFlux'),{type:'bar',
    data:{labels,datasets:[
      {label:'Entradas',data:din,backgroundColor:'#8A4B41',borderRadius:6,barPercentage:.55},
      {label:'Saídas',data:dout,backgroundColor:'#EDCFC6',borderRadius:6,barPercentage:.55}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle'}}},
      scales:{y:{grid:{color:'rgba(138,75,65,.08)'},ticks:{callback:v=>'R$ '+(v/1000)+'k'}},x:{grid:{display:false}}}}});
  const y=thisYM();const byCat={};
  state.saidas.filter(s=>ym(s.data)===y).forEach(s=>{byCat[s.categoria]=(byCat[s.categoria]||0)+s.valor;});
  const cats=Object.keys(byCat);
  const palette=['#8A4B41','#B4776B','#EDCFC6','#D9A79A','#5F332B','#C89185','#A05F52'];
  if(cats.length){
    charts.cat=new Chart(document.getElementById('chCat'),{type:'doughnut',
      data:{labels:cats,datasets:[{data:cats.map(c=>byCat[c]),backgroundColor:palette,borderColor:'#FBF5F1',borderWidth:3}]},
      options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,font:{size:12}}}}}});
  }else{
    document.getElementById('chCat').replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:'Sem saídas este mês'}));
  }
  const byF={};
  state.entradas.filter(e=>ym(e.data)===y&&e.status==='recebido').forEach(e=>{const f=e.formaPgto||'Não informado';byF[f]=(byF[f]||0)+e.valor;});
  const fEl=document.getElementById('chFormas');
  if(fEl){
    const fk=Object.keys(byF);
    if(fk.length){
      charts.formas=new Chart(fEl,{type:'doughnut',
        data:{labels:fk,datasets:[{data:fk.map(k=>byF[k]),backgroundColor:palette,borderColor:'#FBF5F1',borderWidth:3}]},
        options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,font:{size:12}}}}}});
    }else{
      fEl.replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:'Sem recebimentos este mês'}));
    }
  }
}

let movFilter={mes:'',cat:'',q:'',conf:''};
function setMovMes(v){movFilter.mes=v;render();}
function setMovCat(v){movFilter.cat=v;render();}
function setMovConf(v){movFilter.conf=v;render();}
function conferir(kind,id){const x=state[kind].find(i=>i.id===id);if(x){x.conferido=!x.conferido;save();render();}}
function setMovBusca(v){
  // atualiza SÓ a lista e o contador, sem redesenhar a página (preserva o foco no campo)
  movFilter.q=v;
  const kind=page;
  const w=document.getElementById('movListaWrap');if(w)w.innerHTML=movListaHTML(kind);
  const s=document.getElementById('movSub');if(s){const l=movComputeList(kind);s.textContent=l.length+' lançamento(s) · total '+fmt(l.reduce((a,b)=>a+b.valor,0));}
  rotularCelulas();
}
function movComputeList(kind){
  const isIn=kind==='entradas';
  const q=(movFilter.q||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const mt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q);
  return (isIn?state.entradas:state.saidas)
    .filter(x=>(!movFilter.mes||ym(x.data)===movFilter.mes)&&(!movFilter.cat||x.categoria===movFilter.cat)
      &&(!movFilter.conf||(movFilter.conf==='sim')===!!x.conferido)
      &&(!q||mt(x.descricao)||mt(x.categoria)||mt(String(x.valor))||mt(isIn?cliName(x.clienteId):fornName(x.fornecedorId))))
    .sort((a,b)=>b.data.localeCompare(a.data));
}
function movListaHTML(kind){
  const isIn=kind==='entradas';
  const list=movComputeList(kind);
  return list.length?`<table><thead><tr>
    <th>Data</th><th>Descrição</th><th>${isIn?'Cliente':'Fornecedor'}</th><th>Categoria</th><th>Valor</th>${isIn?'<th>Forma</th><th>Status</th>':''}<th></th></tr></thead>
    <tbody>${list.map(x=>`<tr class="${x.conferido?'conferido':''}">
      <td><span class="datacell"><button class="conf ${x.conferido?'on':''}" role="checkbox" aria-checked="${!!x.conferido}" aria-label="Conferido com o extrato" title="${x.conferido?'Conferido. Clique para desmarcar':'Marcar como conferido no extrato'}" onclick="conferir('${kind}','${x.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>${fdate(x.data)}</span></td>
      <td>${esc(x.descricao)}${isIn&&x.semNota?' <span class="pill" style="background:var(--rose-soft);color:var(--terra-dark);font-size:11px">s/ nota</span>':''}${isIn&&!x.semNota&&x.nfEmitida===false?` <span class="pill bad" style="font-size:11px;cursor:pointer" title="Clique quando emitir a NF" onclick="marcarNF('${x.id}')">emitir NF ✓</span>`:''}${isIn&&!x.semNota&&x.nfEmitida===true?' <span class="pill ok" style="font-size:11px">NF ✓</span>':''}${!isIn&&x.semContab?' <span class="pill" style="background:var(--rose-soft);color:var(--terra-dark);font-size:11px">fora contab.</span>':''}</td>
      <td>${isIn?esc(cliName(x.clienteId)):esc(fornName(x.fornecedorId))}</td>
      <td>${esc(x.categoria)}</td>
      <td class="money" style="color:${isIn?'var(--green)':'var(--red)'}">${isIn?'+':'−'} ${fmt(x.valor)}</td>
      ${isIn?`<td>${esc(x.formaPgto||'—')}</td><td>${x.status==='recebido'?'<span class="pill ok">Recebido</span>':`${x.prevista&&x.prevista<today()?'<span class="pill bad">Atrasada</span>':'<span class="pill warn">A receber</span>'} <button class="rowbtn" title="Marcar como recebido" onclick="receber('${x.id}')">✓</button>${x.prevista?`<div class="desc-sub">prev. ${fdate(x.prevista)}</div>`:''}`}</td>`:''}
      <td><button class="rowbtn" onclick="openForm('${isIn?'entrada':'saida'}','${x.id}')">✎</button><button class="rowbtn" onclick="del('${kind}','${x.id}')">🗑</button></td>
    </tr>`).join('')}</tbody></table>`:`<div class="empty">${movFilter.q?'Nenhum lançamento encontrado para "'+esc(movFilter.q)+'".':movFilter.conf?'Nenhum lançamento com esse filtro.':'Nenhum lançamento ainda. Clique em “+ Nova '+(isIn?'entrada':'saída')+'”.'}</div>`;
}
function viewMov(kind){
  const isIn=kind==='entradas';
  const list=movComputeList(kind);
  const total=list.reduce((a,b)=>a+b.valor,0);
  const months=[...new Set((isIn?state.entradas:state.saidas).map(x=>ym(x.data)))].sort().reverse();
  const cats=isIn?CAT_IN:CAT_OUT;
  const base=(isIn?state.entradas:state.saidas).filter(x=>(!movFilter.mes||ym(x.data)===movFilter.mes)&&(!movFilter.cat||x.categoria===movFilter.cat));
  const nConf=base.filter(x=>x.conferido).length;
  const falta=base.filter(x=>!x.conferido).reduce((a,b)=>a+b.valor,0);
  const pct=base.length?Math.round(nConf/base.length*100):0;
  return `
  <div class="topbar"><div><h1>${isIn?'Entradas':'Saídas'}</h1><div class="sub" id="movSub">${list.length} lançamento(s) · total ${fmt(total)}</div></div>
    <button class="btn btn-primary" onclick="openForm('${isIn?'entrada':'saida'}')">+ Nova ${isIn?'entrada':'saída'}</button></div>
  <div class="filters">
    <select onchange="setMovMes(this.value)"><option value="">Todos os meses</option>${months.map(m=>`<option value="${m}" ${movFilter.mes===m?'selected':''}>${monthName(m)}</option>`).join('')}</select>
    <select onchange="setMovCat(this.value)"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${movFilter.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <select onchange="setMovConf(this.value)"><option value="">Conferência: todos</option><option value="nao" ${movFilter.conf==='nao'?'selected':''}>Não conferidos</option><option value="sim" ${movFilter.conf==='sim'?'selected':''}>Conferidos</option></select>
    <input id="movBusca" value="${esc(movFilter.q||'')}" placeholder="🔍 Buscar lançamento…" oninput="setMovBusca(this.value)" autocomplete="off" style="flex:1;min-width:180px">
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('movBusca').value='';setMovBusca('')">Limpar</button>
    ${base.length?`<div class="confbar"><div class="track"><i style="width:${pct}%"></i></div>${nConf} de ${base.length} conferidos${falta?` · falta conferir ${fmt(falta)}`:''}</div>`:''}
  </div>
  <div class="panel" id="movListaWrap">${movListaHTML(kind)}</div>`;
}
function receber(id){const e=state.entradas.find(x=>x.id===id);if(e){e.status='recebido';save();render();}}
function marcarNF(id){const e=state.entradas.find(x=>x.id===id);if(e){e.nfEmitida=true;save();render();}}

      <td class="money">${fmt(c.valor)}</td>

function pagarConta(id){
  const c=state.contas.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Marcar "${c.descricao}" (${fmt(c.valor)}) como paga? Uma saída será lançada automaticamente.`))return;
  c.status='pago';c.pagoEm=today();
  state.saidas.push({id:uid(),data:today(),descricao:c.descricao,fornecedorId:c.fornecedorId,categoria:'Fornecedores',valor:c.valor});
  save();render();
}

function viewClientes(){
  const ano=new Date().getFullYear()+'';
  const y=thisYM();
  const mrr=state.clientes.reduce((a,b)=>a+(b.valorMensal||0),0);
  const noAno={},desde={};
  state.entradas.filter(e=>e.clienteId).forEach(e=>{
    if(e.status==='recebido'&&e.data.slice(0,4)===ano)noAno[e.clienteId]=(noAno[e.clienteId]||0)+e.valor;
    if(!desde[e.clienteId]||e.data<desde[e.clienteId])desde[e.clienteId]=e.data;

/* ---------- GERAR CONTRATO (modelo timbrado) ---------- */
function extenso(v){
  v=Math.round(v*100)/100;const int=Math.floor(v);const cent=Math.round((v-int)*100);
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  function ate999(n){if(n===0)return '';if(n===100)return 'cem';let s='';
    const ce=Math.floor(n/100),de=Math.floor((n%100)/10),un=n%10;
    if(ce)s+=c[ce];
    const resto=n%100;
    if(resto){if(s)s+=' e ';if(resto<20)s+=u[resto];else{s+=d[de];if(un)s+=' e '+u[un];}}
    return s;}
  function grupos(n){if(n===0)return 'zero';let partes=[];
    const mi=Math.floor(n/1000000),mil=Math.floor((n%1000000)/1000),re=n%1000;
    if(mi)partes.push(ate999(mi)+(mi===1?' milhão':' milhões'));
    if(mil)partes.push((mil===1?'mil':ate999(mil)+' mil'));
    if(re)partes.push(ate999(re));
    return partes.join(' e ');}
  let txt=grupos(int)+' '+(int===1?'real':'reais');
  if(cent)txt+=' e '+ate999(cent)+' '+(cent===1?'centavo':'centavos');
  return txt;
}
function fmtExt(v){return fmt(v)+' ('+extenso(v)+')';}
const MESES_EXT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dataExtenso(d){
  if(typeof d==='string'){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return '___ de ______ de ______';
    const [a,m,dd]=d.split('-').map(Number);
    return dd+' de '+MESES_EXT[m-1]+' de '+a;
  }
  return d.getDate()+' de '+MESES_EXT[d.getMonth()]+' de '+d.getFullYear();
}

function addMeses(iso,n){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')||!n)return null;
  const [a,m,d]=iso.split('-').map(Number);
  const ult=new Date(a,m-1+n+1,0).getDate();
  const dt=new Date(a,m-1+n,Math.min(d,ult));
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
/* Lê a proposta e sugere tipo, serviços, plataformas, publicações, valor e prazo */
function gcDaProposta(doc,pid){
  const p=state.propostas.find(x=>x.id===pid);if(!p)return doc;
  const nomes=p.itens.map(i=>i.nome).join(' | ');
  const det=p.itens.map(i=>i.detalhes||'').join('\n');
  const tudo=nomes+'\n'+det;
  const temTraf=/tr[áa]fego/i.test(nomes),temRedes=/redes|social/i.test(nomes);
  const tipo=temTraf&&!temRedes?'trafego':temRedes&&!temTraf?'social':doc.tipo;
  const T=GC_TIPOS[tipo];
  const servicos=[];
  if(tipo==='trafego'){
    if(temTraf)servicos.push(T.servicos[0]);
    if(/criativ/i.test(nomes))servicos.push(T.servicos[1]);
    if(temRedes)servicos.push(T.servicos[2]);
  }else{
    servicos.push(T.servicos[0],T.servicos[1]);
    if(/v[íi]deo/i.test(det)&&!/\b0 v[íi]deos?/i.test(det))servicos.push(T.servicos[2]);
    servicos.push(T.servicos[3]);
  }
  const plats=T.plats.filter(pl=>new RegExp(pl.split(' (')[0].replace(/\s+/g,'\\s*'),'i').test(tudo));
  const pubs=det.split('\n').map(l=>l.trim().replace(/^[-•]\s*/,''))
    .filter(l=>/publica[çc][õo]es? (semana|seman)|v[íi]deos? por m[êe]s|publica[çc][ãa]o semanal/i.test(l)).join('; ');
  const t=propTotais(p);
  const cli=state.clientes.find(c=>c.nome.trim().toLowerCase()===p.nome.trim().toLowerCase());
  return {...doc,tipo,propostaId:pid,servicos,plats:plats.length?plats:doc.plats,
    pubs:pubs||doc.pubs,valor:t.mensal||doc.valor,
    meses:p.duracao&&(p.duracaoUn||'meses')==='meses'?p.duracao:p.duracao&&p.duracaoUn==='anos'?p.duracao*12:doc.meses,
    dataProposta:p.data||doc.dataProposta,razao:doc.razao||p.nome,clienteId:doc.clienteId||(cli?cli.id:'')};
}

function viewContratos(){
  const list=state.contratos.slice().sort((a,b)=>((a.status==='ativo'?0:1)-(b.status==='ativo'?0:1))||(b.inicio||'').localeCompare(a.inicio||''));
  const ativos=list.filter(c=>c.status==='ativo');
  const mensal=ativos.filter(c=>c.periodicidade!=='projeto').reduce((a,b)=>a+b.valor,0);
  const hoje=today();
  return `
  <div class="topbar"><div><h1>Contratos</h1><div class="sub">${ativos.length} ativo(s) · ${fmt(mensal)}/mês contratados</div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ghost" onclick="openGerarContrato()">📄 Gerar contrato</button><button class="btn btn-primary" onclick="openForm('contrato')">+ Novo contrato</button></div></div>
  <div class="panel">${list.length?`<table><thead><tr>
    <th>Cliente</th><th>Serviço / contrato</th><th>Valor</th><th>Início</th><th>Término</th><th>Status</th><th></th></tr></thead>
    <tbody>${list.map(c=>{
      const vencendo=c.status==='ativo'&&c.fim&&c.fim>=hoje&&(new Date(c.fim)-new Date(hoje))/864e5<=30;
      const vencido=c.status==='ativo'&&c.fim&&c.fim<hoje;
      return `<tr>
      <td><b>${esc(cliName(c.clienteId))}</b></td>
      <td>${esc(c.titulo)}${c.obs?`<div class="desc-sub">${esc(c.obs)}</div>`:''}</td>
      <td class="money">${fmt(c.valor)}<div class="desc-sub">${c.periodicidade==='projeto'?'projeto único':'por mês'}</div></td>
      <td>${fdate(c.inicio)}</td>
      <td>${c.fim?fdate(c.fim):'—'}${vencendo?' <span class="pill warn" style="font-size:11px">renova em breve</span>':''}${vencido?' <span class="pill bad" style="font-size:11px">vencido</span>':''}</td>
      <td>${c.status==='rascunho'?'<span class="pill warn">Aguardando assinatura</span>':c.status==='ativo'?'<span class="pill ok">Ativo</span>':c.status==='pausado'?'<span class="pill warn">Pausado</span>':'<span class="pill bad">Encerrado</span>'}</td>
      <td style="white-space:nowrap">${c.doc?`<button class="btn btn-ghost btn-sm" onclick="gerarContratoPDF('${c.id}')">⤓ PDF</button> `:''}<button class="rowbtn" onclick="${c.doc?`openGerarContrato('${c.id}')`:`openForm('contrato','${c.id}')`}">✎</button><button class="rowbtn" onclick="del('contratos','${c.id}')">🗑</button></td>
    </tr>`;}).join('')}</tbody></table>`:`<div class="empty">Nenhum contrato cadastrado. Clique em "+ Novo contrato".</div>`}</div>`;
}

       'Grupo no WhatsApp para contato direto','Não está incluso o valor dos patrocinados e desenvolvimento de criativos'].map(x=>'- '+x).join('\n');
   }
 }
};
function regenDet(el){
  const row=el.closest('.prop-item');
  const svc=row.dataset.svc;
  if(!svc||!ASSISTENTES[svc])return;
  const t=row.querySelector('.pi-det');
  t.value=ASSISTENTES[svc].gerar(row);
  t.style.display='block';
}
function durTxt(p){
  if(!p.duracao)return'';
  const u={semanas:['semana','semanas'],meses:['mês','meses'],anos:['ano','anos']}[p.duracaoUn||'meses'];
  return p.duracao+' '+(p.duracao===1?u[0]:u[1]);
}
function propTotais(p){
  const mensal=p.itens.filter(i=>i.tipo==='mensal').reduce((a,b)=>a+b.valor,0);
  const unico=p.itens.filter(i=>i.tipo!=='mensal').reduce((a,b)=>a+b.valor,0);
  return {mensal,unico};
}

function salvarProposta(id,gerar){
  const nome=document.getElementById('pr_nome').value.trim();
  if(!nome){alert('Informe o nome do cliente.');return;}
  const itens=[...document.querySelectorAll('#propItens .prop-item')].map(r=>({
    nome:r.querySelector('.pi-nome').value.trim(),
    valor:parseFloat(r.querySelector('.pi-valor').value)||0,
    tipo:r.querySelector('.pi-tipo').value,
    detalhes:r.querySelector('.pi-det').value.trim()
  })).filter(i=>i.nome&&i.valor>0);
  if(!itens.length){alert('Adicione pelo menos um serviço com valor.');return;}
  const obj={
    nome,contato:document.getElementById('pr_contato').value.trim(),
    itens,desconto:parseFloat(document.getElementById('pr_desc').value)||0,
    duracao:parseInt(document.getElementById('pr_dur').value)||0,
    duracaoUn:document.getElementById('pr_duru').value,
    validade:document.getElementById('pr_val').value||null,
    obs:document.getElementById('pr_obs').value.trim()
  };
  let pid=id;
  if(id){Object.assign(state.propostas.find(x=>x.id===id),obj);}
  else{pid=uid();state.propostas.push({id:pid,data:today(),status:'rascunho',...obj});}
  save();closeModal();render();
  if(gerar)gerarPropostaPDF(pid);
}

/* ---------- META DO ANO ---------- */
function metaAno(){return state.config.metaAno!=null?state.config.metaAno:360000;}
function setMetaAno(v){state.config.metaAno=parseFloat(v)||0;save();render();}
function metaPorMes(){
  const ano=new Date().getFullYear();
  return Array.from({length:12},(_,i)=>{
    const y=ano+'-'+String(i+1).padStart(2,'0');
    return state.entradas.filter(e=>ym(e.data)===y&&e.status==='recebido').reduce((a,b)=>a+b.valor,0);
  });
}
function viewMeta(){
  const ano=new Date().getFullYear();
  const meta=metaAno();
  const porMes=metaPorMes();
  const total=porMes.reduce((a,b)=>a+b,0);
  const falta=Math.max(meta-total,0);
  const pct=meta>0?Math.min(total/meta*100,100):0;
  const mesesPassados=new Date().getMonth()+1;
  const mediaAtual=total/mesesPassados;
  const mesesRestantes=12-mesesPassados;
  const ritmo=mesesRestantes>0?falta/mesesRestantes:0;
  const batida=total>=meta&&meta>0;
  return `
  <div class="topbar"><div><h1>Meta do Ano · ${ano}</h1><div class="sub">${batida?'Meta batida! 🎉 Parabéns!':'Acompanhe o faturamento rumo à meta'}</div></div></div>
  <div class="cards">
    <div class="card"><div class="lbl">Faturado em ${ano}</div><div class="val pos">${fmt(total)}</div><div class="note">média de ${fmt(mediaAtual)}/mês até agora</div></div>
    <div class="card"><div class="lbl">Meta anual</div><div class="val">${fmt(meta)}</div><div class="note">editar: R$ <input type="number" min="0" step="1000" value="${meta}" onchange="setMetaAno(this.value)" style="width:110px;padding:3px 8px;border:1.5px solid var(--rose);border-radius:8px;background:#fff;outline:none;font-size:12.5px"></div></div>
    <div class="card"><div class="lbl">Falta para a meta</div><div class="val ${batida?'pos':'neg'}">${batida?'—':fmt(falta)}</div><div class="note">${batida?'objetivo alcançado ✓':mesesRestantes>0?'precisa de '+fmt(ritmo)+'/mês até dezembro':'último mês do ano'}</div></div>
    <div class="card"><div class="lbl">Atingido</div>
      <div style="position:relative;height:92px;margin-top:2px">
        <canvas id="chMetaPie"></canvas>
        <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:18px;color:var(--terra-deep);pointer-events:none">${pct.toFixed(1).replace('.',',')}%</span>
      </div>
    </div>
  </div>
  <div class="panel" style="margin-bottom:24px;padding:16px 22px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;flex-wrap:wrap;gap:6px"><span>Progresso da meta</span><span><b style="color:var(--terra-deep)">${fmt(total)}</b> de ${fmt(meta)}</span></div>
    <div style="background:var(--bg);border-radius:99px;height:12px;overflow:hidden">
      <div style="width:${pct}%;background:linear-gradient(90deg,var(--terra),#B4776B);height:100%;border-radius:99px"></div>
    </div>
  </div>
  <div class="panel"><h3>Faturamento mês a mês × ritmo da meta</h3><div class="chartbox" style="height:300px"><canvas id="chMeta"></canvas></div></div>`;
}
function drawMetaChart(){
  const meta=metaAno();
  const porMes=metaPorMes();
  const el=document.getElementById('chMeta');if(!el)return;
  Chart.defaults.font.family='Jost';Chart.defaults.color='#7A5F58';
  const totalAno=porMes.reduce((a,b)=>a+b,0);
  const faltaAno=Math.max(meta-totalAno,0);
  const pctA=meta>0?Math.min(totalAno/meta*100,100):0;
  const pie=document.getElementById('chMetaPie');
  if(pie){
    charts.metaPie=new Chart(pie,{type:'doughnut',
      data:{labels:['Atingido · '+pctA.toFixed(1).replace('.',',')+'%','Faltando · '+(100-pctA).toFixed(1).replace('.',',')+'%'],
        datasets:[{data:[totalAno,faltaAno],backgroundColor:['#8A4B41','#EDCFC6'],borderColor:'#FBF5F1',borderWidth:3}]},
      options:{maintainAspectRatio:false,cutout:'72%',plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:c=>' '+c.label.split(' ·')[0]+': '+fmt(c.parsed)+' ('+(meta>0?(c.parsed/meta*100).toFixed(1).replace('.',','):0)+'%)'}}
      }}});
  }
  charts.meta=new Chart(el,{type:'bar',
    data:{labels:['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],datasets:[
      {type:'bar',label:'Faturado',data:porMes,backgroundColor:'#8A4B41',borderRadius:6,barPercentage:.6},
      {type:'line',label:'Ritmo da meta ('+fmt(meta/12)+'/mês)',data:Array(12).fill(meta/12),borderColor:'#B98A3C',borderDash:[6,5],pointRadius:0,borderWidth:2}
    ]},

/* ---------- FECHAMENTO ANUAL ---------- */
let anualAno=new Date().getFullYear();
function setAnualAno(v){anualAno=parseInt(v);render();}
function dadosAnuais(ano){
  const ent=Array(12).fill(0),sai=Array(12).fill(0),imp=Array(12).fill(0);
  let prolabore=0;
  state.entradas.filter(e=>e.status==='recebido'&&+e.data.slice(0,4)===ano).forEach(e=>{ent[+e.data.slice(5,7)-1]+=e.valor;});
  state.saidas.filter(s=>+s.data.slice(0,4)===ano).forEach(s=>{const m=+s.data.slice(5,7)-1;sai[m]+=s.valor;if(s.categoria==='Impostos')imp[m]+=s.valor;if(s.categoria==='Pró-labore')prolabore+=s.valor;});
  return {ent,sai,imp,prolabore};
}
function viewAnual(){
  const anos=[...new Set([...state.entradas.map(e=>+e.data.slice(0,4)),...state.saidas.map(s=>+s.data.slice(0,4)),new Date().getFullYear()])].sort((a,b)=>b-a);
  if(!anos.includes(anualAno))anualAno=anos[0];
  const d=dadosAnuais(anualAno);
  const totalEnt=d.ent.reduce((a,b)=>a+b,0);
  const totalSai=d.sai.reduce((a,b)=>a+b,0);
  const totalImp=d.imp.reduce((a,b)=>a+b,0);
  const lucro=totalEnt-totalSai;
  const mesesComDados=d.ent.filter(v=>v>0).length||1;
  const media=totalEnt/mesesComDados;
  const nomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let melhor={v:-1,m:0},pior={v:Infinity,m:0};
  d.ent.forEach((v,i)=>{if(v>0){if(v>melhor.v)melhor={v,m:i};if(v<pior.v)pior={v,m:i};}});
  // crescimento: compara com ano anterior
  const dAnt=dadosAnuais(anualAno-1);
  const totalAnt=dAnt.ent.reduce((a,b)=>a+b,0);
  const cresc=totalAnt>0?((totalEnt-totalAnt)/totalAnt*100):null;
  // ranking clientes
  const rec={};
  state.entradas.filter(e=>e.status==='recebido'&&+e.data.slice(0,4)===anualAno&&e.clienteId).forEach(e=>{rec[e.clienteId]=(rec[e.clienteId]||0)+e.valor;});
  const top=Object.entries(rec).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxTop=top.length?top[0][1]:1;
  return `
  <div class="topbar"><div><h1>Fechamento Anual</h1><div class="sub">Retrato completo de ${anualAno}</div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select style="padding:10px 16px;border:1.5px solid var(--rose);border-radius:10px;background:var(--cream);outline:none" onchange="setAnualAno(this.value)">${anos.map(a=>`<option value="${a}" ${a===anualAno?'selected':''}>${a}</option>`).join('')}</select>
      <button class="btn btn-primary" onclick="gerarFechamentoPDF(${anualAno})">⤓ PDF do ano</button>
    </div></div>
  <div class="cards">
    <div class="card"><div class="lbl">Faturamento do ano</div><div class="val pos">${fmt(totalEnt)}</div><div class="note">média de ${fmt(media)}/mês</div></div>
    <div class="card"><div class="lbl">Despesas do ano</div><div class="val neg">${fmt(totalSai)}</div></div>
    <div class="card"><div class="lbl">Lucro do ano</div><div class="val ${lucro>=0?'pos':'neg'}">${fmt(lucro)}</div><div class="note">${totalEnt>0?(lucro/totalEnt*100).toFixed(0):0}% de margem</div></div>
    <div class="card"><div class="lbl">vs ${anualAno-1}</div><div class="val" style="color:${cresc==null?'var(--ink-soft)':cresc>=0?'var(--green)':'var(--red)'}">${cresc==null?'—':(cresc>=0?'+':'')+cresc.toFixed(0)+'%'}</div><div class="note">${cresc==null?'sem ano anterior':'crescimento'}</div></div>
  </div>
  <div class="cards" style="margin-bottom:24px">
    <div class="card"><div class="lbl">Melhor mês</div><div class="val" style="font-size:22px">${melhor.v>0?nomes[melhor.m]:'—'}</div><div class="note">${melhor.v>0?fmt(melhor.v):''}</div></div>
    <div class="card"><div class="lbl">Menor mês</div><div class="val" style="font-size:22px">${pior.v<Infinity?nomes[pior.m]:'—'}</div><div class="note">${pior.v<Infinity?fmt(pior.v):''}</div></div>
    <div class="card"><div class="lbl">Impostos no ano</div><div class="val" style="color:var(--amber)">${fmt(totalImp)}</div><div class="note">${totalEnt>0?(totalImp/totalEnt*100).toFixed(1):0}% do faturamento</div></div>
    <div class="card"><div class="lbl">Pró-labore no ano</div><div class="val">${fmt(d.prolabore)}</div></div>
  </div>
  <div class="panel" style="margin-bottom:24px"><h3>Faturamento × Despesas × Lucro (mês a mês)</h3><div class="chartbox" style="height:300px"><canvas id="chAnual"></canvas></div></div>
  <div class="panel"><h3>Ranking de clientes em ${anualAno}</h3>
    ${top.length?`<div class="ranklist">${top.map(([id,v])=>`<div class="rk"><span class="nm">${esc(cliName(id))}</span><span class="bar" style="width:${Math.max(10,Math.round(v/maxTop*160))}px"></span><span class="vl">${fmt(v)} · ${(v/totalEnt*100).toFixed(1)}%</span></div>`).join('')}</div>`:`<div class="empty">Sem entradas vinculadas a clientes neste ano.</div>`}
  </div>`;
}

/* Aviso ao entrar: contratos a até 15 dias do término (ou vencidos) */
function checkContratos(){
  const hoje=today();
  const alvo=state.contratos
    .filter(c=>c.status==='ativo'&&c.fim)
    .map(c=>({c,dias:Math.ceil((new Date(c.fim)-new Date(hoje))/864e5)}))
    .filter(x=>x.dias<=15)

  if(!alvo.length)return;
  const md=document.getElementById('modal');

    <span class="amt" style="color:${dias<0?'var(--red)':'var(--amber)'}">${dias<0?'vencido há '+Math.abs(dias)+' dia(s)':dias===0?'vence hoje':'faltam '+dias+' dia(s)'}</span></div>`).join('')}</div>

}

function calcPrec(saveTax){
  const gv2=id=>{const el=document.getElementById(id);return el?parseFloat(el.value)||0:0;};
  const v=gv2('p_valor'),tax=gv2('p_tax'),custo=gv2('p_custo'),alvo=gv2('p_alvo');
  if(saveTax){state.config.simTax=tax;save();}
  const imp=v*tax/100,liq=v-imp-custo;
  const set=(id,txt,cor)=>{const el=document.getElementById(id);if(el){el.textContent=txt;if(cor)el.style.color=cor;}};
  set('p_imp',v?('− '+fmt(imp)):'—');
  set('p_cus',v?('− '+fmt(custo)):'—');
  set('p_liq',v?fmt(liq):'—',liq>=0?'var(--green)':'var(--red)');
  set('p_mar',v?((liq/v*100).toFixed(1).replace('.',',')+'%'):'—',liq>=0?'var(--green)':'var(--red)');
  const cobrar=tax<100?(alvo+custo)/(1-tax/100):0;
  set('p_cobrar',alvo?fmt(cobrar):'—','var(--terra-deep)');
}

/* ---------- GERAR RELATÓRIO (PDF/IMPRESSÃO) ---------- */
function gerarRelatorio(scope,fiscal){
  const isMes=scope==='mes';
  const modoFiscal=fiscal===true;
  const modoSem=fiscal==='semnota';
  const inPeriod=d=>!isMes||ym(d)===relMes;
  const ents=state.entradas.filter(e=>inPeriod(e.data)&&(modoFiscal?!e.semNota:true)&&(modoSem?e.semNota:true)).sort((a,b)=>a.data.localeCompare(b.data));

  const entPend=ents.filter(e=>e.status==='a_receber').reduce((a,b)=>a+b.valor,0);
  const saiTot=sais.reduce((a,b)=>a+b.valor,0);

  const reserva=entRec*state.config.taxPct/100;
  const abertas=modoSem?[]:state.contas.filter(c=>c.status!=='pago').sort((a,b)=>a.vencimento.localeCompare(b.vencimento));

  const byCat=(list,key)=>{const o={};list.forEach(x=>{o[x[key]]=(o[x[key]]||0)+x.valor;});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};

  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório · Amanda Pinheiro</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>

    .head .ttl{text-align:right}
    .head .ttl h1{font-family:'Playfair Display',serif;font-weight:500;font-size:24px;color:var(--deep)}
    .head .ttl .p{color:var(--muted);font-size:13px;margin-top:3px;text-transform:capitalize}
    h2{font-family:'Playfair Display',serif;font-weight:500;font-size:17px;color:var(--deep);margin:26px 0 10px}
    .sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .sum{background:var(--soft);border-radius:12px;padding:13px 16px}
    .sum .l{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
    .sum .v{font-family:'Playfair Display',serif;font-size:19px;margin-top:3px;color:var(--deep)}
    .sum .v.g{color:var(--green)}.sum .v.d{color:var(--red)}
    table{width:100%;border-collapse:collapse;margin-top:6px}
    th{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 9px;border-bottom:1.5px solid var(--rose)}
    td{padding:7px 9px;border-bottom:1px solid var(--soft)}
    td.r,th.r{text-align:right;white-space:nowrap}
    td.g{color:var(--green);font-weight:500}td.d{color:var(--red);font-weight:500}
    .tot td{font-weight:600;border-top:2px solid var(--rose);border-bottom:none}

    .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--rose);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
    .printbar{position:fixed;top:14px;right:14px}
    .printbar button{font-family:'Jost';background:var(--terra);color:var(--rose);border:none;border-radius:99px;padding:11px 24px;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(95,51,43,.3)}
    .empty{color:var(--muted);padding:10px 2px}
    @media print{.printbar{display:none}body{padding:10px 0}}
  </style></head><body>
  <div class="printbar"><button onclick="window.print()">🖨 Imprimir / Salvar em PDF</button></div>
  <div class="head">
    <div class="brand"><div class="mono">AP</div><div class="nm">AMANDA PINHEIRO</div></div>
    <div class="ttl"><h1>Relatório Financeiro</h1><div class="p">${periodo}</div></div>
  </div>
  ${modoSem?`<div class="sumgrid" style="grid-template-columns:repeat(3,1fr)">
    <div class="sum"><div class="l">Recebido (sem nota)</div><div class="v g">${fmt(entRec)}</div></div>

    <div class="sum"><div class="l">Total do período</div><div class="v">${fmt(entRec+entPend)}</div></div>
  </div>`:`<div class="sumgrid" style="grid-template-columns:repeat(${modoFiscal?3:4},1fr)">
    <div class="sum"><div class="l">Entradas recebidas</div><div class="v g">${fmt(entRec)}</div></div>

    ${modoFiscal?'':`<div class="sum"><div class="l">Reserva impostos (${state.config.taxPct}%)</div><div class="v">${fmt(reserva)}</div></div>`}
  </div>
  ${entPend?`<p style="margin-top:10px;color:var(--muted)">Além disso, há <b>${fmt(entPend)}</b> em entradas ainda a receber no período.</p>`:''}`}
  <div class="cols">
    <div><h2>Entradas por categoria</h2>${catIn.length?catIn.map(([c,v])=>`<div class="catrow"><span>${esc(c)}</span><b style="color:var(--green)">${fmt(v)}</b></div>`).join(''):'<div class="empty">Sem entradas no período.</div>'}</div>
    ${modoSem?'':`<div><h2>Saídas por categoria</h2>${catOut.length?catOut.map(([c,v])=>`<div class="catrow"><span>${esc(c)}</span><b style="color:var(--red)">${fmt(v)}</b></div>`).join(''):'<div class="empty">Sem saídas no período.</div>'}</div>`}

  <h2>Entradas (${ents.length})</h2>
  ${ents.length?`<table><thead><tr><th>Data</th><th>Descrição</th><th>Cliente</th><th>Categoria</th><th class="r">Valor</th></tr></thead>
  <tbody>${rows(ents,true)}<tr class="tot"><td colspan="4">Total de entradas (recebidas)</td><td class="r g">${fmt(entRec)}</td></tr></tbody></table>`:'<div class="empty">Sem entradas no período.</div>'}
  ${modoSem?'':`<h2>Saídas (${sais.length})</h2>
  ${sais.length?`<table><thead><tr><th>Data</th><th>Descrição</th><th>Fornecedor</th><th>Categoria</th><th class="r">Valor</th></tr></thead>
  <tbody>${rows(sais,false)}<tr class="tot"><td colspan="4">Total de saídas</td><td class="r d">${fmt(saiTot)}</td></tr></tbody></table>`:'<div class="empty">Sem saídas no período.</div>'}`}

  </body></html>`;

  const w=window.open('','_blank');
  if(!w){alert('O navegador bloqueou a janela do relatório. Permita pop-ups para este site e tente de novo.');return;}

}

function drawRelCharts(){
  const entRec=state.entradas.filter(e=>ym(e.data)===relMes&&e.status==='recebido').reduce((a,b)=>a+b.valor,0);
  const sai=sumMonth(state.saidas,relMes);
  const reserva=entRec*state.config.taxPct/100;
  const livre=Math.max(entRec-sai-reserva,0);
  const el=document.getElementById('chRel');if(!el)return;
  if(entRec===0&&sai===0){el.replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:'Sem dados'}));return;}
  charts.rel=new Chart(el,{type:'doughnut',
    data:{labels:['Custos','Reserva impostos','Livre'],datasets:[{data:[sai,reserva,livre],backgroundColor:['#8A4B41','#D9A79A','#EDCFC6'],borderColor:'#FBF5F1',borderWidth:3}]},
    options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8}}}}});
}

function del(coll,id){
  if(!confirm('Excluir este registro?'))return;
  state[coll]=state[coll].filter(x=>x.id!==id);save();render();
}

function closeModal(){document.getElementById('overlay').classList.remove('open');document.getElementById('modal').style.width='';}
function gv(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function submitForm(type,id){
  const num=v=>parseFloat(v)||0;
  if(type==='entrada'||type==='saida'||type==='conta'||type==='contrato'){
    if(!gv('f_desc')){alert('Preencha a descrição.');return;}
    if(num(gv('f_valor'))<=0){alert('Informe um valor maior que zero.');return;}
  }
  if((type==='fornecedor'||type==='cliente')&&!gv('f_nome')){alert('Preencha o nome.');return;}
  if(type==='entrada'){
    const _sn=document.getElementById('f_semnota').checked;
    const obj={data:gv('f_data')||today(),descricao:gv('f_desc'),clienteId:gv('f_cli')||null,categoria:gv('f_cat'),valor:num(gv('f_valor')),status:gv('f_st'),semNota:_sn,nfEmitida:_sn?null:document.getElementById('f_nfe').checked,formaPgto:gv('f_fp'),prevista:gv('f_prev')||null};
    if(id){Object.assign(state.entradas.find(x=>x.id===id),obj);}else{state.entradas.push({id:uid(),...obj});}
  }
  if(type==='saida'){
    const obj={data:gv('f_data')||today(),descricao:gv('f_desc'),fornecedorId:gv('f_forn')||null,categoria:gv('f_cat'),valor:num(gv('f_valor')),semContab:document.getElementById('f_ssc').checked};
    if(id){Object.assign(state.saidas.find(x=>x.id===id),obj);}else{state.saidas.push({id:uid(),...obj});}
  }
  if(type==='conta'){
    const obj={descricao:gv('f_desc'),fornecedorId:gv('f_forn')||null,valor:num(gv('f_valor')),vencimento:gv('f_venc')||today(),recorrente:document.getElementById('f_crec').checked};
    if(id){Object.assign(state.contas.find(x=>x.id===id),obj);}else{state.contas.push({id:uid(),status:'pendente',...obj});}
  }
  if(type==='contrato'){
    const obj={clienteId:gv('f_cli')||null,titulo:gv('f_desc'),valor:num(gv('f_valor')),periodicidade:gv('f_per'),inicio:gv('f_ini')||today(),fim:gv('f_fim')||null,status:gv('f_st2'),obs:gv('f_obs')};
    if(id){Object.assign(state.contratos.find(x=>x.id===id),obj);}else{state.contratos.push({id:uid(),...obj});}
  }
  if(type==='fornecedor'){
    const obj={nome:gv('f_nome'),servico:gv('f_serv'),contato:gv('f_cont')};
    if(id){Object.assign(state.fornecedores.find(x=>x.id===id),obj);}else{state.fornecedores.push({id:uid(),...obj});}
  }
  if(type==='cliente'){
    const marcados=[...document.querySelectorAll('#f_svcbox input:checked')].map(x=>x.value);
    const extras=gv('f_servx').split(',').map(s=>s.trim()).filter(Boolean);
    const servicos=[...marcados,...extras];
    const st=gv('f_cst')||'ativo';
    const obj={nome:gv('f_nome'),servicos,servico:servicos.join(', '),valorMensal:num(gv('f_vm')),diaCobranca:Math.min(Math.max(parseInt(gv('f_dia'))||5,1),28),categoria:gv('f_ccat')||'Gestão de redes',semNota:document.getElementById('f_csn').checked,status:st,desde:gv('f_cini')||null,saidaEm:st==='inativo'?(gv('f_cfim')||today()):null};
    if(id){Object.assign(state.clientes.find(x=>x.id===id),obj);}else{state.clientes.push({id:uid(),...obj});}
  }
  save();closeModal();render();
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

window.__apReady=true;
</script>
</body>
</html>
